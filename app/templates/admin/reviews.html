<div class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-ink mb-6">Review Moderation</h1>

  <div class="flex gap-2 mb-6 text-sm font-semibold">
      <a href="{{ url_for('admin.reviews', status=s) }}"
         class="px-3 py-1.5 rounded-md border {% if status == s %}bg-ink text-white border-ink{% else %}border-stone-300 text-stone-600 hover:bg-stone-100{% endif %}">{{ s.replace('_',' ') }}</a>

  </div>


    <div class="card p-10 text-center text-stone-500">No reviews in this state.</div>

    <div class="space-y-3">
        <div class="card p-4">
          <div class="flex justify-between">
            <div>
              <div class="font-semibold text-sm">{{ r.user.name }} · {{ r.target_type }}</div>
              <div class="star-rating">{{ "★" * r.rating }}{{ "☆" * (5 - r.rating) }}</div>
            </div>
            <span class="text-xs text-stone-400">{{ r.created_at | timeago }}</span>
          </div>
          <div class="text-sm text-stone-600 mt-1">{{ r.review_text or "" }}</div>
          <div class="flex gap-2 mt-3">
              <form method="post" action="{{ url_for('admin.review_action', review_id=r.id, action='remove') }}">
                <button class="text-xs font-semibold text-red-600 hover:underline">Remove</button>
              </form>
              <form method="post" action="{{ url_for('admin.review_action', review_id=r.id, action='restore') }}">
                <button class="text-xs font-semibold text-bazaar-700 hover:underline">Restore</button>
              </form>
          </div>
        </div>
    </div>
</div>
