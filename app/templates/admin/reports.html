<div class="max-w-4xl mx-auto px-4 py-8">
<h1 class="text-2xl font-bold text-ink mb-6">Reports</h1>

  <div class="flex gap-2 mb-6 text-sm font-semibold">
      <a href="{{ url_for('admin.reports', status=s) }}"
         class="px-3 py-1.5 rounded-md border {% if status == s %}bg-ink text-white border-ink{% else %}border-stone-300 text-stone-600 hover:bg-stone-100{% endif %}">{{ s.replace('_',' ') }}</a>
  </div>

    <div class="card p-10 text-center text-stone-500">No reports in this state.</div>
      <div class="space-y-3">
        <div class="card p-4">
          <div class="flex justify-between">
            <div>
              <div class="font-semibold text-sm">{{ r.report_type.replace('_',' ') }}</div>
              <div class="text-xs text-stone-500">
              </div>
            </div>
            <span class="text-xs text-stone-400">{{ r.created_at | timeago }}</span>
          </div>
          <div class="text-sm text-stone-600 mt-1">{{ r.description }}</div>{% endif %}
          <div class="flex gap-2 mt-3">
              <form method="post" action="{{ url_for('admin.report_action', report_id=r.id, action='review') }}">
                <button class="text-xs font-semibold text-stone-600 hover:underline">Investigate</button>
              </form>
            <form method="post" action="{{ url_for('admin.report_action', report_id=r.id, action='resolve') }}">
                <button class="text-xs font-semibold text-bazaar-700 hover:underline">Resolve</button>
              </form>
            <form method="post" action="{{ url_for('admin.report_action', report_id=r.id, action='dismiss') }}">
                <button class="text-xs font-semibold text-stone-400 hover:underline">Dismiss</button>
              </form>
            <a href="{{ url_for('product.shop_profile', shop_id=r.shop_id) }}" class="text-xs font-semibold text-stone-500 hover:underline">View Shop</a>
            </div>
        </div>
    </div>
</div>
