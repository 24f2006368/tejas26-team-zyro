<!-- shop categories are mentioned -->
<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-ink">Categories</h1>
  </div>

  <form method="post" action="{{ url_for('admin.add_category') }}" class="card p-4 flex gap-2 mb-6">
    <input name="name" placeholder="Category name" required class="flex-1 border border-stone-300 rounded-md px-3 py-2 text-sm">
    <select name="type" class="border border-stone-300 rounded-md px-3 py-2 text-sm">
      <option value="SHOP">Shop</option><option value="SERVICE">Service</option>
      <option value="FOOD">Food</option><option value="SPECIALTY">Specialty</option>
    </select>
    <button class="bg-bazaar-700 text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-bazaar-800">Add</button>
  </form>

  <div class="grid sm:grid-cols-2 gap-3">
      <div class="card p-3 flex justify-between text-sm">
        <span>{{ c.name }}</span>
        <span class="badge badge-neutral">{{ c.type }}</span>
      </div>
  </div>
</div>
