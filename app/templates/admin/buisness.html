<div class="max-w-5xl mx-auto px-4 py-8">
  
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-ink">Businesses</h1>
    <form method="get" class="flex gap-2">
      <input name="q" value="{{ q }}" placeholder="Search businesses" class="border border-stone-300 rounded-md px-3 py-2 text-sm">
      <button class="border border-stone-300 rounded-md px-3 py-2 text-sm font-semibold hover:bg-stone-100">Search</button>
    </form>
  </div>
  <div class="card overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-stone-50 text-stone-500 text-xs uppercase"><tr>
        <th class="text-left px-4 py-3">Shop</th><th class="text-left px-4 py-3">Owner</th>
        <th class="text-left px-4 py-3">Status</th><th class="text-left px-4 py-3">Rating</th><th class="px-4 py-3"></th>
      </tr></thead>
      <tbody>
        
          <tr class="border-t border-stone-100">
            <td class="px-4 py-3 font-semibold">{{ shop.name }}</td>
            <td class="px-4 py-3 text-stone-500">{{ shop.owner.name }}</td>
            <td class="px-4 py-3"><span class="badge {% if shop.verification_status == 'APPROVED' %}badge-verified{% elif shop.verification_status == 'SUSPENDED' %}badge-danger{% else %}badge-neutral{% endif %}">{{ shop.verification_status }}</span></td>
            <td class="px-4 py-3 text-stone-500">{{ shop.rating_average or "—" }}</td>
            <td class="px-4 py-3 text-right">
              
                <form method="post" action="{{ url_for('admin.suspend_business', shop_id=shop.id) }}">
                  
                  <button class="text-red-600 font-semibold hover:underline text-xs">Suspend</button>
                </form>
              
            </td>
          </tr>
        
      </tbody>
    </table>
  </div>
</div>
