{% extends "base.html" %}
{% block title %}Join NearCart{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="card p-8">
    <h1 class="text-2xl font-bold text-ink mb-1">Join NearCart</h1>
    <p class="text-stone-500 text-sm mb-6">Discover what's around you. Takes less than a minute.</p>
    <form method="post" class="space-y-4">
      {% include "partials/csrf.html" %}
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1">Full name</label>
        <input type="text" name="name" value="{{ form.get('name','') }}" required
               class="w-full rounded-md border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-bazaar-500">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Email</label>
          <input type="email" name="email" value="{{ form.get('email','') }}"
                 class="w-full rounded-md border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-bazaar-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Phone</label>
          <input type="text" name="phone" value="{{ form.get('phone','') }}"
                 class="w-full rounded-md border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-bazaar-500">
        </div>
      </div>
      <p class="text-xs text-stone-400 -mt-2">Provide at least one of email or phone.</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Password</label>
          <input type="password" name="password" required
                 class="w-full rounded-md border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-bazaar-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-1">Confirm password</label>
          <input type="password" name="confirm_password" required
                 class="w-full rounded-md border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-bazaar-500">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-stone-700 mb-1">Address <span class="text-stone-400">(optional)</span></label>
        <input type="text" name="address" value="{{ form.get('address','') }}"
               class="w-full rounded-md border border-stone-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-bazaar-500">
      </div>
      <button type="submit" class="w-full bg-bazaar-700 text-white py-2.5 rounded-md font-semibold hover:bg-bazaar-800">
        Create account
      </button>
    </form>
    <div class="mt-6 text-sm text-stone-500 text-center">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="text-bazaar-700 font-semibold hover:underline">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
