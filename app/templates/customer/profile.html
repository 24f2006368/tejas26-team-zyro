{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold text-ink mb-6">Your Profile</h1>
  <form method="post" class="card p-6 space-y-4">
    {% include "partials/csrf.html" %}
    <div>
      <label class="block text-sm font-medium mb-1">Name</label>
      <input name="name" value="{{ current_user.name }}" class="w-full border border-stone-300 rounded-md px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input value="{{ current_user.email or '—' }}" disabled class="w-full border border-stone-200 bg-stone-50 rounded-md px-3 py-2 text-stone-400">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Phone</label>
      <input value="{{ current_user.phone or '—' }}" disabled class="w-full border border-stone-200 bg-stone-50 rounded-md px-3 py-2 text-stone-400">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Address</label>
      <input name="address" value="{{ current_user.address or '' }}" class="w-full border border-stone-300 rounded-md px-3 py-2">
    </div>
    <button type="submit" class="bg-bazaar-700 text-white px-5 py-2.5 rounded-md font-semibold hover:bg-bazaar-800">Save</button>
  </form>
</div>
{% endblock %}
